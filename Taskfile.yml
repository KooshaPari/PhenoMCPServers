version: "3"

vars:
  REPO_LANGUAGE:
    sh: |
      if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f requirements.txt ]; then
        printf "python"
      elif [ -f package.json ]; then
        printf "node"
      elif [ -f go.mod ]; then
        printf "go"
      elif [ -f Cargo.toml ]; then
        printf "rust"
      else
        printf "unknown"
      fi

tasks:
  build:
    desc: Build the project for the detected language
    cmds:
      - |
        case "{{.REPO_LANGUAGE}}" in
          python)
            uv build
            ;;
          node)
            if [ -f pnpm-lock.yaml ]; then
              pnpm build
            elif [ -f yarn.lock ]; then
              yarn build
            else
              npm run build
            fi
            ;;
          go)
            go build ./...
            ;;
          rust)
            cargo build
            ;;
          *)
            echo "No build task configured for detected language: {{.REPO_LANGUAGE}}"
            exit 1
            ;;
        esac

  test:
    desc: Run the project test suite
    cmds:
      - |
        case "{{.REPO_LANGUAGE}}" in
          python)
            PYTHONPATH=src python -m pytest tests/unit -q
            ;;
          node)
            if [ -f pnpm-lock.yaml ]; then
              pnpm test
            elif [ -f yarn.lock ]; then
              yarn test
            else
              npm test
            fi
            ;;
          go)
            go test ./...
            ;;
          rust)
            cargo test
            ;;
          *)
            echo "No test task configured for detected language: {{.REPO_LANGUAGE}}"
            exit 1
            ;;
        esac

  doctor:
    desc: Run repository doctor checks
    cmds:
      - ./scripts/doctor.sh

  smoke:
    desc: Run runtime smoke checks against local statusd
    cmds:
      - ./tests/smoke/smoke.sh

  validate:
    desc: Run tests plus local doctor and smoke validation
    cmds:
      - task: test
      - task: doctor
      - task: smoke

  lint:
    desc: Run the project linter
    cmds:
      - |
        case "{{.REPO_LANGUAGE}}" in
          python)
            uv run --with ruff ruff check .
            ;;
          node)
            if [ -f pnpm-lock.yaml ]; then
              pnpm lint
            elif [ -f yarn.lock ]; then
              yarn lint
            else
              npm run lint
            fi
            ;;
          go)
            go vet ./...
            ;;
          rust)
            cargo clippy --all-targets --all-features
            ;;
          *)
            echo "No lint task configured for detected language: {{.REPO_LANGUAGE}}"
            exit 1
            ;;
        esac

  clean:
    desc: Remove build outputs and local caches
    cmds:
      - |
        case "{{.REPO_LANGUAGE}}" in
          python)
            python -c 'import textwrap; exec(textwrap.dedent("""
            from pathlib import Path
            import shutil
            root = Path(".")
            names = {"__pycache__", ".pytest_cache", ".ruff_cache", ".mypy_cache", ".pyright"}
            paths = [root / name for name in ("build", "dist", "htmlcov", ".coverage", "coverage.xml")]
            paths.extend(path for path in root.rglob("*") if path.name in names)
            paths.extend(root.rglob("*.egg-info"))
            for path in sorted(set(paths), key=lambda item: len(item.parts), reverse=True):
                if path.is_dir():
                    shutil.rmtree(path, ignore_errors=True)
                elif path.exists():
                    path.unlink()
            """))'
            ;;
          node)
            python -c 'import textwrap; exec(textwrap.dedent("""
            from pathlib import Path
            import shutil
            for name in ("node_modules", "dist", "build", "coverage", ".turbo", ".next", ".cache"):
                path = Path(name)
                if path.is_dir():
                    shutil.rmtree(path, ignore_errors=True)
                elif path.exists():
                    path.unlink()
            """))'
            ;;
          go)
            python -c 'import textwrap; exec(textwrap.dedent("""
            from pathlib import Path
            import shutil
            for name in ("bin", "cover.out", "coverage.out"):
                path = Path(name)
                if path.is_dir():
                    shutil.rmtree(path, ignore_errors=True)
                elif path.exists():
                    path.unlink()
            """))'
            ;;
          rust)
            cargo clean
            ;;
          *)
            python -c 'import textwrap; exec(textwrap.dedent("""
            from pathlib import Path
            import shutil
            for name in ("build", "dist", "htmlcov", "node_modules", "coverage", ".turbo", ".next", ".cache", "bin"):
                path = Path(name)
                if path.is_dir():
                    shutil.rmtree(path, ignore_errors=True)
                elif path.exists():
                    path.unlink()
            """))'
            ;;
        esac
