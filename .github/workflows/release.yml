name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to cut (e.g. v0.2.0). Leave blank to dry-run.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — build sdist+wheel and upload artifacts only.'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.1.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48 # v5.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@e2c4c0b3b07a04e4e3a9b3e8e4f06a5a7d4d68b1 # v3.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build sdist + wheel
        run: uv build

      - name: Verify metadata
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/agent-user-status/
    permissions:
      id-token: write  # OIDC for PyPI trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc8016b9 # v4.1.8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@67339c736fd9354cd4f8cb0b744f2b82a74b5c70 # v1.12.3

  github-release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc8016b9 # v4.1.8
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@9d8e6d8c9b1a5b0a3f0e8a1d4b3a7b2c5b3c1d2e # v2.0.6
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
