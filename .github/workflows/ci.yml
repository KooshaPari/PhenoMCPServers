name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/unit -q

  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime without launch services
        env:
          AGENT_USER_STATUS_STRICT: "0"
        run: ./scripts/install.sh --no-start

      - name: Run backend smoke checks
        env:
          AGENT_USER_STATUS_SMOKE_SKIP_IMESSAGE: "1"
        run: |
          ~/.local/bin/agent-user-statusd serve > /tmp/agent-user-statusd.log 2>&1 &
          echo "$!" > /tmp/agent-user-statusd.pid
          trap 'kill "$(cat /tmp/agent-user-statusd.pid)" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then
              ./tests/smoke/smoke.sh
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/agent-user-statusd.pid)" 2>/dev/null; then
              cat /tmp/agent-user-statusd.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/agent-user-statusd.log
          exit 1
