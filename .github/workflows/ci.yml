name: CI

on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.1.1

      - name: Set up Python
        uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48 # v-latest
        with:
          python-version: "3.12"

      - name: Install quality dependencies
        run: python -m pip install --upgrade pip ruff pyright pytest numpy

      - name: Ruff
        env:
          PYTHONPATH: src
        run: python -m ruff check .

      - name: Pyright
        run: pyright

  package-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.1.1

      - name: Validate macOS package helper
        run: |
          bash -n packaging/scripts/build-macos-pkg.sh
          bash -n packaging/scripts/stage-macos-payload.sh
          bash -n packaging/scripts/validate-packaging.sh
          bash -n packaging/scripts/validate-python-dist.sh
          packaging/scripts/validate-packaging.sh all
          packaging/scripts/validate-python-dist.sh --dry-run
          packaging/scripts/build-macos-pkg.sh --dry-run

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.1.1

      - name: Set up Python
        uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48 # v-latest
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/unit -q

  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.1.1

      - name: Set up Python
        uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48 # v-latest
        with:
          python-version: "3.12"

      - name: Install runtime without launch services
        env:
          AGENT_USER_STATUS_STRICT: "0"
        run: ./scripts/install.sh --no-start

      - name: Run backend smoke checks
        run: |
          ~/.local/bin/agent-user-statusd serve > /tmp/agent-user-statusd.log 2>&1 &
          echo "$!" > /tmp/agent-user-statusd.pid
          trap 'kill "$(cat /tmp/agent-user-statusd.pid)" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 15); do
            set +e
            curl -fsS --max-time 3 http://127.0.0.1:8765/health >/tmp/agent-user-statusd-health.out 2>/tmp/agent-user-statusd-health.err
            curl_status="$?"
            set -e
            if [ "${curl_status}" = "0" ]; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/agent-user-statusd.pid)" 2>/dev/null; then
              cat /tmp/agent-user-statusd-health.err
              cat /tmp/agent-user-statusd.log
              exit 1
            fi
            sleep 1
          done
          if [ "${ready}" != "1" ]; then
            cat /tmp/agent-user-statusd-health.err
            cat /tmp/agent-user-statusd.log
            exit 1
          fi
          AGENT_USER_STATUS_SMOKE_SKIP_IMESSAGE=1 bash -x ./tests/smoke/smoke.sh
          if ! kill -0 "$(cat /tmp/agent-user-statusd.pid)" 2>/dev/null; then
            cat /tmp/agent-user-statusd.log
            exit 1
          fi
          echo "backend smoke passed"
          exit 0
