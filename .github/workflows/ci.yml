name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/unit -q

  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime without launch services
        env:
          AGENT_USER_STATUS_STRICT: "0"
        run: ./scripts/install.sh --no-start

      - name: Run backend smoke checks
        run: |
          ~/.local/bin/agent-user-statusd serve > /tmp/agent-user-statusd.log 2>&1 &
          echo "$!" > /tmp/agent-user-statusd.pid
          trap 'kill "$(cat /tmp/agent-user-statusd.pid)" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/agent-user-statusd.pid)" 2>/dev/null; then
              cat /tmp/agent-user-statusd.log
              exit 1
            fi
            sleep 1
          done
          if [ "${ready}" != "1" ]; then
            cat /tmp/agent-user-statusd.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:8765/health >/dev/null
          status_code="$(curl -s -o /tmp/raw.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8765/dev/eye \
            -H 'content-type: application/json' \
            -d '{"score":0.5,"state":"raw_camera_frame"}')"
          test "${status_code}" = "422"
          curl -fsS -X POST http://127.0.0.1:8765/dev/eye \
            -H 'content-type: application/json' \
            -d '{"screen_x":720,"screen_y":450,"screen_width":1440,"screen_height":900,"score":0.9,"confidence":0.92,"stability_score":0.91,"targeting_reliable":true,"filter_mode":"tracking","state":"looking_at_screen:ci","max_age_seconds":60}' \
            | grep -q 'looking_at_screen:ci'
          status_code="$(curl -s -o /tmp/correction.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8765/correction/event \
            -H 'content-type: application/json' \
            -d '{"kind":"cursor_click","score":0.9,"state":"ci_cursor_click","harmony_hint":true,"max_age_seconds":30,"screen_x":780,"screen_y":430,"screen_width":1440,"screen_height":900}')"
          test "${status_code}" = "200"
          grep -q '"learnable": true' /tmp/correction.json
          curl -fsS 'http://127.0.0.1:8765/correction/events?limit=20&reliable_only=true' \
            | grep -q 'ci_cursor_click'
          if ! kill -0 "$(cat /tmp/agent-user-statusd.pid)" 2>/dev/null; then
            cat /tmp/agent-user-statusd.log
            exit 1
          fi
          echo "backend smoke passed"
          exit 0
