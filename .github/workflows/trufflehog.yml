name: Trufflehog Secrets Scan
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  trufflehog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@0a12ed9e1a4ce4b1a02a5f2dd1e3a9c9e6c7f8b1 # v5
        with:
          go-version: 'stable'
      - run: go install github.com/trufflehog/trufflehog/v3@v3.87.0
      - run: trufflehog github --repo https://github.com/${{ github.repository }} --only-verified --no-update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
