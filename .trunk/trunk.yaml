---
# Trunk Check configuration. The v0.1 schema is required by current
# Trunk CLI/action releases; plugins provide the per-language definitions.
version: 0.1

cli:
  version: 1.25.0

plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins

# mcpforge declares `go 1.24.0`; without this Trunk defaults to Go 1.21.
runtimes:
  enabled:
    - go@1.24.0

# Pin supported plugin definitions rather than relying on a moving generated
# default. `golangci-lint` retains the repository's existing v1 config files.
lint:
  enabled:
    - actionlint@1.7.8
    - black@25.9.0
    - clippy@1.65.0
    - eslint@8.10.0
    - golangci-lint@1.64.8
    - mypy@1.20.2
    - prettier@3.6.2
    - ruff@0.14.3
    - rustfmt@1.65.0
    - shellcheck@0.11.0
    - taplo@0.10.0
    - yamllint@1.37.1

actions:
  enabled:
    - trunk-upgrade-available
