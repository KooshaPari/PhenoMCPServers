---
# Trunk Check configuration. The v0.1 schema is required by current
# Trunk CLI/action releases; plugins provide the per-language definitions.
version: 0.1

cli:
  version: 1.25.0

plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins

# The highest embedded Go module requirement is ops-mcp's Go 1.26.0.
runtimes:
  enabled:
    - go@1.26.0

# Pin supported plugin definitions rather than relying on a moving generated
# default. The v2 linter is required for the Go 1.26 module.
lint:
  enabled:
    - actionlint@1.7.8
    - black@25.9.0
    - clippy@1.94.0
    - eslint@8.10.0
    - golangci-lint2@2.12.2
    - mypy@1.20.2
    - prettier@3.6.2
    - ruff@0.14.3
    - rustfmt@1.94.0
    - shellcheck@0.11.0
    - taplo@0.10.0
    - yamllint@1.37.1

actions:
  enabled:
    - trunk-upgrade-available
